# Publishes the Python package to PyPI with Trusted Publishing (no token) on a tag like py-v0.1.0.
# One-time setup on pypi.org: add a pending publisher for project "company-id-validators", this repository,
# workflow "publish-pypi.yml", environment "pypi".
name: Publish to PyPI

on:
  push:
    tags:
      - 'py-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build && python -m build
      - run: python -m unittest discover -s tests
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
